name: CI

# Gate de PRs a main: build + tests unitarios ANTES de mergear (build-and-push corre recién al
# pushear a ae/test|ae/beta, o sea después del merge — este workflow cierra ese agujero).
# Exigirlo en branch protection: Settings → Branches → Require status checks → "build-and-test".
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests (sin DB)
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~Integration"

      # Tests de integración (Testcontainers + Postgres 17): el runner de GitHub trae Docker.
      - name: Integration tests (Testcontainers)
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName~Integration"
