name: Build and Push to Insecure Registry

# Un entorno por rama: push a `ae/test` -> imagen :test, push a `ae/beta` -> imagen :beta.
# `main` es integración: NO buildea ni pushea (sin entorno). El config de cada entorno lo fija
# este workflow (tag de imagen) sobre el docker-compose.yml base — sin archivos override por entorno.
on:
  push:
    branches:
      - ae/test
      - ae/beta
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a buildear'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - beta

env:
  # TODO: reemplazar por el registry real del proyecto (host:puerto). Único lugar a tocar.
  DOCKER_REGISTRY: registry.example.com:5000

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gate de tests: se ejecutan ANTES de buildear/pushear; si fallan, el pipeline se detiene.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run backend unit tests
        # Solo tests unitarios (sin DB). Los de Integration requerirían un servicio Postgres.
        run: dotnet test Papasur.Tests/Papasur.Tests.csproj -c Release --filter "FullyQualifiedName!~Integration"

      - name: Setup QEMU (optional, multi-arch support)
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Ensure docker compose plugin is installed
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi
          docker compose version

      - name: Configure Docker daemon to allow insecure registry
        run: |
          sudo mkdir -p /etc/docker
          if [ -f /etc/docker/daemon.json ]; then
            sudo cp /etc/docker/daemon.json /etc/docker/daemon.json.bak || true
            if ! grep -q '"insecure-registries"' /etc/docker/daemon.json; then
              echo "{\"insecure-registries\":[\"${DOCKER_REGISTRY}\"]}" | sudo tee /etc/docker/daemon.json
            else
              echo "daemon.json ya contiene insecure-registries; no se modifica"
            fi
          else
            echo "{\"insecure-registries\":[\"${DOCKER_REGISTRY}\"]}" | sudo tee /etc/docker/daemon.json
          fi
          sudo systemctl restart docker
          for i in 1 2 3 4 5; do
            docker info >/dev/null 2>&1 && break || sleep 1
          done
          docker info | grep -i "Server Version" || true

      - name: Determine environment (tag) from branch
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.environment }}"
          else
            REF="${{ github.ref_name }}"
          fi
          # Acepta el nombre de rama (ae/test, ae/beta) o el input del dispatch (test, beta).
          case "$REF" in
            beta|ae/beta) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=test" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Entorno resuelto: $REF"

      - name: Build images (compose)
        env:
          API_IMAGE_TAG: ${{ steps.env.outputs.tag }}
        run: docker compose -f docker-compose.yml build --pull --parallel --progress=plain

      - name: Push images defined in compose
        env:
          API_IMAGE_TAG: ${{ steps.env.outputs.tag }}
        run: docker compose -f docker-compose.yml push

      - name: Show composed images (quick check)
        env:
          API_IMAGE_TAG: ${{ steps.env.outputs.tag }}
        run: docker compose -f docker-compose.yml config | sed -n '1,200p' | grep -E 'image:|service_name' -n || true
