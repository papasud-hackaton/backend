name: Guardia de dirección de merge

# Las ramas de ENTORNO (test/beta) sólo RECIBEN merges (feature -> main -> test/beta para deploy);
# nunca pueden ser ORIGEN de un merge (ni a main, ni a la otra rama de entorno, ni a feature/subfeat).
# Este check falla el PR cuando la rama origen es `ae/test` o `ae/beta`, en cualquier destino.
#
# Nota: para que esto BLOQUEE el merge (y no sólo lo marque en rojo), hay que exigir este check en la
# protección de rama del destino (Settings → Branches/Rules → Require status checks → "Guardia de dirección de merge").
# GitHub evalúa el workflow de `pull_request` desde la rama BASE del PR: por eso vive en main, test y beta.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  bloquear-origen-entorno:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el origen no sea una rama de entorno
        run: |
          SRC="${{ github.head_ref }}"
          DST="${{ github.base_ref }}"
          echo "PR: '$SRC' -> '$DST'"
          case "$SRC" in
            ae/test|ae/beta)
              echo "::error::La rama de entorno '$SRC' no puede ser ORIGEN de un merge. Flujo permitido: feature → main → test/beta. PR rechazado."
              exit 1
              ;;
          esac
          echo "OK: origen '$SRC' permitido."
